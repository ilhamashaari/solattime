<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SolatTime</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>SolatTime</h1>
    <nav>
      <a href="index.html" class="active">Home</a>
      <a href="calendar.html">Calendar</a>
      <a href="reminders.html">Reminders</a>
    </nav>
  </header>

  <main>
    <!-- Search form -->
    <section class="card">
      <div class="form-row">
        <div class="field">
          <label for="city">City</label>
          <input type="text" id="city" placeholder="e.g. Kuala Lumpur">
        </div>
        <div class="field">
          <label for="country">Country</label>
          <input type="text" id="country" value="Malaysia">
        </div>
        <button id="searchBtn">Get Prayer Times</button>
      </div>
      <p id="message"></p>
    </section>

    <div class="grid">
      <!-- Prayer times and countdown -->
      <section class="card">
        <h3>Prayer Times</h3>
        <p id="hijri"></p>
        <ul id="timesList"></ul>
      </section>

      <section class="card">
        <h3>Next Prayer</h3>
        <h2 id="countdown"></h2>
        <p id="qibla"></p>
        <h3>Suggestion for now</h3>
        <p id="suggestion"></p>
      </section>
    </div>

    <section class="card">
      <h3>Name of Allah of the day</h3>
      <p id="asma"></p>
    </section>

    <section class="card">
      <h3>Recent suggestions</h3>
      <ul id="suggestionHistory"></ul>
    </section>
  </main>

  <script src="js/storage.js"></script>
  <script src="js/api.js"></script>
  <script src="js/calculation.js"></script>
  <script src="js/suggestion.js"></script>
  <script src="js/home.js"></script>
</body>
</html>
